<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Мои оценки — личный дневник студента колледжа: журнал оценок, зачёты и экзамены, автоматический расчёт семестровой оценки.">
  <meta name="theme-color" content="#15803d">
  <title>Мои оценки — дневник студента</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315803d'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Segoe UI, sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Тема применяется до первой отрисовки, чтобы не было мигания
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('myGrades.v4') || 'null');
        var choice = (saved && saved.settings && saved.settings.theme) || 'system';
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = choice === 'system' ? (dark ? 'dark' : 'light') : choice;
        document.documentElement.dataset.themeChoice = choice;
      } catch (e) {}
    })();
  </script>
</head>
<body>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-today" viewBox="0 0 24 24">
    <rect x="3" y="4.5" width="18" height="16.5" rx="3"/>
    <path d="M8 2.5v4M16 2.5v4M3 9.5h18"/>
    <circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-grades" viewBox="0 0 24 24">
    <rect x="5" y="4" width="14" height="17" rx="2.5"/>
    <path d="M9 4V2.8h6V4M9 10h6M9 14h6M9 18h3"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24">
    <path d="M3.5 20.5h17M6.5 20.5v-6M11 20.5V8.5M15.5 20.5v-4M20 20.5V5"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <path d="M4 7h9M17 7h3M4 12h4M12 12h8M4 17h10M18 17h2"/>
    <circle cx="15" cy="7" r="2"/>
    <circle cx="10" cy="12" r="2"/>
    <circle cx="16" cy="17" r="2"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7Z"/>
  </symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24">
    <rect x="2.5" y="4" width="19" height="13" rx="2.5"/>
    <path d="M8.5 20.5h7M12 17v3.5"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v5M14 11v5"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 24 24">
    <path d="M4 20l4.2-1 10.5-10.5a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/>
    <path d="M13.5 6.5l4 4"/>
  </symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4 12.5l5 5L20 6.5"/>
  </symbol>
  <symbol id="i-star" viewBox="0 0 24 24">
    <path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.6 9.6l6.5-.9Z" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo"><svg class="icon"><use href="#i-star"></use></svg></span>
      <span class="brand-text">Мои оценки</span>
    </div>

    <nav class="nav" aria-label="Разделы">
      <button class="nav-item" data-action="nav" data-view="today" data-nav="today">
        <svg class="icon"><use href="#i-today"></use></svg><span>Сегодня</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="grades" data-nav="grades">
        <svg class="icon"><use href="#i-grades"></use></svg><span>Оценки</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="semester" data-nav="semester">
        <svg class="icon"><use href="#i-chart"></use></svg><span>Итоги</span>
      </button>
      <button class="nav-item" data-action="nav" data-view="settings" data-nav="settings">
        <svg class="icon"><use href="#i-settings"></use></svg><span>Настройки</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <div class="avatar" id="userAvatar">УА</div>
        <div class="user-meta">
          <strong id="sideName">Усманов Артур</strong>
          <span id="sideGroup">1 курс, группа 1Р-2</span>
        </div>
      </div>
      <p class="hint">Данные хранятся в вашем браузере</p>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <h1 class="topbar-title" id="pageTitle">Сегодня</h1>
      <div class="topbar-right">
        <label class="semester-picker" for="semesterSelect">
          <span class="semester-picker-label">Семестр</span>
          <select id="semesterSelect" aria-label="Семестр">
            <option value="1">1 семестр</option>
            <option value="2">2 семестр</option>
          </select>
        </label>
        <div class="theme-switch" role="group" aria-label="Тема оформления">
          <button class="theme-btn" data-action="theme" data-theme-value="light" title="Светлая, бело-зелёная" aria-label="Светлая тема">
            <svg class="icon"><use href="#i-sun"></use></svg>
          </button>
          <button class="theme-btn" data-action="theme" data-theme-value="dark" title="Тёмная, чёрно-белая" aria-label="Тёмная тема">
            <svg class="icon"><use href="#i-moon"></use></svg>
          </button>
          <button class="theme-btn" data-action="theme" data-theme-value="system" title="Как в системе" aria-label="Системная тема">
            <svg class="icon"><use href="#i-monitor"></use></svg>
          </button>
        </div>
        <button class="btn btn-primary add-btn" data-action="add-grade">
          <svg class="icon"><use href="#i-plus"></use></svg><span class="hide-sm">Оценка</span>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <p style="padding:24px;font-family:sans-serif">Для работы сайта нужен включённый JavaScript.</p>
</noscript>

<script src="js/app.js"></script>
</body>
</html>
